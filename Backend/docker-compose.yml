version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: blink-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: blink_messenger
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: blink-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: blink-backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/blink_messenger
      NODE_ENV: development
      PORT: 3000
      JWT_SECRET: your-super-secret-jwt-key-change-in-production
      SMS_PROVIDER: console
      UPLOAD_DIR: /app/uploads
    ports:
      - "3000:3000"
    volumes:
      - ./src:/app/src
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && node src/index.js"

  # Optional: Prisma Studio for database management
  prisma-studio:
    image: node:20-alpine
    container_name: blink-prisma-studio
    working_dir: /app
    command: sh -c "npm install -g prisma && npx prisma studio --hostname 0.0.0.0 --port 5555"
    ports:
      - "5555:5555"
    volumes:
      - ./prisma:/app/prisma
    depends_on:
      - postgres

volumes:
  postgres_data:
  redis_data: