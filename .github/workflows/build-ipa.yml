name: Build Blink Messenger IPA (Unsigned)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build iOS IPA (Unsigned)
    runs-on: macos-latest

    env:
      PROJECT_PATH: iOS/BlinkMessenger.xcodeproj
      SCHEME: BlinkMessenger

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      - name: Build Archive (Unsigned)
        run: |
          xcodebuild \
            -project "${{ env.PROJECT_PATH }}" \
            -scheme "${{ env.SCHEME }}" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/BlinkMessenger.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual

      - name: Create Unsigned IPA
        run: |
          set -e
          APP="$RUNNER_TEMP/BlinkMessenger.xcarchive/Products/Release-iphoneos/BlinkMessenger.app"
          if [ ! -d "$APP" ]; then
            echo "App not found at $APP"
            echo "Contents of archive:"
            find "$RUNNER_TEMP/BlinkMessenger.xcarchive" -maxdepth 3 -type d
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa"
          zip -r -q /tmp/BlinkMessenger-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: BlinkMessenger-unsigned-ipa
          path: /tmp/BlinkMessenger-unsigned.ipa
          retention-days: 30

      - name: Build Success
        run: echo "✅ Unsigned IPA successfully built and uploaded!"
